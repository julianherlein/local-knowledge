[project]
name = "kb-engine"
version = "0.1.0"
description = "Personal knowledge base engine: capture, fetch, tag, summarize into an Obsidian vault."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kb-llm",
    "typer>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "yt-dlp>=2026.8.19",
    "webvtt-py>=0.5.1",
    "trafilatura>=2.2",
    "python-frontmatter>=1.3",
    "python-slugify>=9.1",
    "filelock>=3.16",
    "keyring>=25",
    "pyyaml>=6",
]

[project.scripts]
kb = "kb.cli:app"

[dependency-groups]
dev = ["pytest>=9", "respx>=0.23", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.uv.workspace]
members = ["services/llm"]

[tool.uv.sources]
kb-llm = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "services/llm/tests"]
pythonpath = ["."]
markers = [
    "live: hits a real external service (network or claude CLI); skipped unless opted in",
]
addopts = "-m 'not live' -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
