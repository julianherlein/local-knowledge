[project]
name = "kb-llm"
version = "0.1.0"
description = "LLM service for kb-engine: routes every model call through the local Claude Code CLI."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_llm"]
